name: DartTracker
options:
  minimumXcodeGenVersion: 2.37.0
  deploymentTarget:
    iOS: 16.0
packages: {}

targets:
  DartTracker:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DartTracker
        excludes:
          - Resources/Preview Content
    resources:
      - path: DartTracker/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DartTracker
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        DEVELOPMENT_TEAM: ""
        INFOPLIST_FILE: DartTracker/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone, iPad
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: []
      gatherCoverageData: false


